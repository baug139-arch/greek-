<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#CA8A04" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.4"/>
  
  <!-- Central Greek Emblem: Α Ω and Book / Cross motif -->
  <g filter="url(#glow)">
    <!-- Greek Alpha -->
    <text x="180" y="295" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="160" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">Α</text>
    <!-- Greek Omega -->
    <text x="332" y="295" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="160" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">Ω</text>
    
    <!-- Central Divider / Chi-Rho or Olive Branch Accent -->
    <circle cx="256" cy="256" r="8" fill="#FDE047"/>
    <path d="M256 150 L256 360" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
  
  <!-- Subtitle Text -->
  <text x="256" y="415" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="34" font-weight="600" fill="#E2E8F0" letter-spacing="6" text-anchor="middle">ΚΟΙΝΗ</text>
</svg>
